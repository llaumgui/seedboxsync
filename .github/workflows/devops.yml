name: DevOps
on:
  [push, pull_request]
env:
  pythonLastVersion: '3.14'
  nodeLastVersion: '26.X'
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: llaumgui/seedboxsync

jobs:

  ##############################################################################
  # Test python application
  #
  test_python:
    runs-on: ubuntu-latest
    name: Test Python
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
    # Setup Python
    - name: Install Just
      uses: taiki-e/install-action@just
    - name: Setup Python ${{ matrix.python-version }} with uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
    # Instal & run task
    - name: Install Python dependencies
      run: uv sync --locked --extra dev
    - name: Run Python tests
      run: just test-ci
    - uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml


  ##############################################################################
  # Test Node.js application
  #
  test_nodejs:
    runs-on: ubuntu-latest
    name: Test Javascript
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.X, 24.X, 26.X]
    steps:
    - name: Git checkout
      uses: actions/checkout@v6
    # Setup Node.js
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10
        cache: true
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    # Instal & run task
    - name: Install Node.js dependencies
      run: pnpm install --frozen-lockfile
    - name: Run Node.js tests
      run: pnpm test:lint


  ##############################################################################
  # Markdownlint
  #
  test_markdownlint:
    runs-on: ubuntu-latest
    name: MarkdownLint
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
    - name: markdownlint-cli
      uses: nosborn/github-action-markdown-cli@v3.5.0
      with:
        files: "*.md docs/"
        config_file: ".markdownlint.yaml"


  ##############################################################################
  # Dockerfile tests
  #
  test_dockerfiles:
    runs-on: ubuntu-latest
    name: Linters for Dockerfile
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
    - name: hadolint
      uses: hadolint/hadolint-action@v3.3.0
      with:
        recursive: true


  ##############################################################################
  # SonarCloud job
  #
  test_sonar:
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    needs: [
      test_python,
      test_markdownlint,
      test_dockerfiles,
      test_nodejs
    ]
    runs-on: ubuntu-latest
    name: SonarCloud analyse
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Disabling shallow clones is recommended for improving the relevancy of reporting
    # https://docs.sonarsource.com/sonarqube/latest/project-administration/analysis-scope/#sonarqube-respects-ignored-files
    - name: Remove .gitignore because SonarQube respects ignored files
      run: rm .gitignore
    - uses: actions/download-artifact@v8
      with:
        name: coverage-${{ env.pythonLastVersion }}
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  ##############################################################################
  # Package job
  #
  package:
    needs: [
      test_sonar
    ]
    runs-on: ubuntu-latest
    name: Build package
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
    # Setup Python
    - name: Install Just
      uses: taiki-e/install-action@just
    - name: Setup Python ${{ matrix.python-version }} with uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ env.pythonLastVersion }}
    # Setup Node.js
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10
        cache: true
    - name: Use Node.js ${{ env.nodeLastVersion }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.nodeLastVersion }}
        cache: 'pnpm'
    # Instal & run task
    - name: Install Python dependencies
      run: uv sync --locked --extra dev
    - name: Install Node.js  dependencies
      run: pnpm install --frozen-lockfile
    - name: Package
      run: just dist
    - name: Archive package
      uses: actions/upload-artifact@v7
      with:
        name: seedboxsync-${{ github.sha }}.tar.gz
        path: dist/*.tar.gz


  ##############################################################################
  # Build and tests Docker image
  #
  test_docker:
    needs: [
      test_sonar
    ]
    runs-on: ubuntu-latest
    name: Build and test docker images
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
    # Extract metadata (tags, labels) for Docker
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images:
          ${{ env.IMAGE_NAME }}
    # Build and push Docker image with Buildx (don't push on PR)
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        tags: |
          ${{ env.IMAGE_NAME }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.IMAGE_NAME }}
        cache-to: type=inline
    # Test with Trivy
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_NAME }}
        format: 'template'
        template: '@/contrib/sarif.tpl'
        output: 'trivy-results.sarif'
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4.37.4
      with:
        sarif_file: 'trivy-results.sarif'


  ##############################################################################
  # Build and deploy job (only on main / develop branches and on tags, and not on PR)
  #
  docker_build_deploy:
    if: ${{ github.event_name != 'pull_request' && ( github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') ) }}
    needs: [
      test_docker
    ]
    runs-on: ubuntu-latest
    name: Build and deploy docker images
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
    # Login against 2 Docker registries except on PR
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Log into registry ${{ env.GHCR_REGISTRY }}
      uses: docker/login-action@v4
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Extract metadata (tags, labels) for Docker
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_NAME }}
          ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
    # Build and push Docker image with Buildx (don't push on PR)
    - name: Set env
      if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      run: echo "RELEASE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
    - name: Build and push Docker image
      if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      uses: docker/build-push-action@v7
      with:
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.IMAGE_NAME }}:${{ env.RELEASE_BRANCH }}
          ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_BRANCH }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:${{ env.RELEASE_BRANCH }}
        cache-to: type=inline
    - name: Set env
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV
    - name: Build and push Docker image
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      uses: docker/build-push-action@v7
      with:
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
        cache-to: type=inline


  ##############################################################################
  # Release job
  #
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [
      package,
    ]
    runs-on: ubuntu-latest
    name: Release on GitHub and PyPi
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
    - name: Set env
      run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV
    # Setup Python
    - name: Install Just
      uses: taiki-e/install-action@just
    - name: Setup Python ${{ env.pythonLastVersion }} with uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ env.pythonLastVersion }}
    # Setup Node.js
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10
        cache: true
    - name: Use Node.js ${{ env.nodeLastVersion }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.nodeLastVersion }}
        cache: 'pnpm'
    # Instal & run task
    - name: Install Python dependencies
      run: uv sync --locked --extra dev
    - name: Install Node.js Dependencies
      run: pnpm install --frozen-lockfile
    - name: Package
      run: just dist
    # Release on GitHub
    - name: Create GitHub release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Changes in this Release
          - First Change
          - Second Change
        draft: true
        prerelease: false
    - name: Upload asset in GitHub release
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
        asset_path: dist/seedboxsync-${{ env.RELEASE_VERSION }}.tar.gz
        asset_name: seedboxsync-${{ env.RELEASE_VERSION }}.tar.gz
        asset_content_type: application/tar+gzip
    # Release on Pypi
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@master
      with:
        user: __token__
        password: ${{ secrets.PYPI_PASSWORD }}
