#
# Project
#
[project]
name = "seedboxsync"
description = "Application for sync operations between your NAS and your seedbox"
dynamic = ["version"]
authors = [
  { name = "Guillaume Kulakowski", email = "guillaume@kulakowski.fr" }
]
keywords = [
  "seedbox",
  "nas",
  "sync",
  "sftp",
  "ftp",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: System Administrators",
  "Topic :: Internet",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: POSIX"
]
readme = "README.md"
license-files = ["LICENSE"]
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
  "bcoding>=1.5",
  "click>=8.4.2",
  "flask>=3.1.3",
  "flask-babel>=4.0.0",
  "flask-caching>=2.4.1",
  "flask-restx>=1.3.2",
  "huey>=3.3.2",
  "humanize>=4.16.0",
  "ftputil>=5.2.0",
  "paramiko>=5.0.0",
  "peewee>=4.3.0",
  "python-slugify>=8.0.4",
  "tabulate>=0.10.0",
  "typing-extensions>=4.16.0",
]

[project.urls]
Home = "https://llaumgui.github.io/seedboxsync/"
Documentation = "https://llaumgui.github.io/seedboxsync/"
Source = "https://github.com/llaumgui/seedboxsync/"

[project.optional-dependencies]
dev = [
  "basedpyright>=1.39.9",
  "coverage>=7.15.4",
  "flit>=3.12.0",
  "mkdocs-coverage>=2.0.0",
  "mkdocs-include-markdown-plugin>=7.3.0",
  "mkdocs-material>=9.7.7",
  "mkdocstrings-python>=2.0.5",
  "mypy>=2.3.0",
  "properdocs>=1.6.7",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.1",
  "twine>=7.0.0",
]

[project.scripts]
seedboxsync = "seedboxsync.cli:cli"

#
# Build
#
[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

#
# flit
#
[tool.flit.sdist]
include = [
  "seedboxsync/front/static/dist/**",
  "README.md",
  "LICENSE"
]
exclude = [
  ".github/**",
  "docker/**",
  "screenshots/**",
  "doc/**",
  "logo/**",
  "tests/**",
  ".dockerignore",
  ".editorconfig",
  ".flake8",
  ".gitignore",
  ".hadolint.yaml",
  ".markdownlint.yaml",
  "Dockerfile",
  "justfile",
  "package.json",
  "pnpm-lock.yaml",
  "sonar-project.properties",
  "vite.config.js",
]

#
# mypy
#
[tool.mypy]
files = ["seedboxsync"]
ignore_missing_imports = true
strict = true
show_error_codes = true
pretty = true

#
# basedpyright
#
[tool.basedpyright]
include = ["seedboxsync"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingImports = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

#
# ruff
#
[tool.ruff]
line-length = 160
target-version = "py311"
src = ["seedboxsync", "tests"]

[tool.ruff.lint]
select = [
    # Core
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings

    # Imports
    "I",      # isort

    # Bugs
    "B",      # flake8-bugbear
    "A",      # builtins
    "C4",     # comprehensions
    "SIM",    # simplify
    "RET",    # return
    "RSE",    # raise
    "TRY",    # tryceratops

    # Good practices
    "UP",     # pyupgrade
    "PIE",    # misc improvements
    "T20",    # print()
    "PTH",    # pathlib
    "G",      # logging
    "LOG",    # logging
    "RUF",    # Ruff-specific
    "ISC",    # implicit string concat

    # Documentation
    "D",      # pydocstyle

    # Type annotations
    "ANN",

]
ignore = [
    # Docstrings
    "D205",
    "D212",

    # Too opinionated
    "TRY003",

    # logging
    "G004",

    # Type hints
    "ANN401",  # Any
]
exclude = [
  "*.egg",
  "build/*",
  "docs/*"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["seedboxsync"]
no-lines-before = ["standard-library", "third-party", "first-party", "local-folder"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.pycodestyle]
max-line-length = 160

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",
    "ANN",
]

#
# PyTest coverage
#
[tool.coverage.report]
omit = [
    "*/templates/*",
    "*/static/*",
]
