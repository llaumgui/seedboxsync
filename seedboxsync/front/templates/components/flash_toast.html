{% set all_messages = get_flashed_messages(with_categories=true) %}
{% set toasts = [] %}
{% for cat, msg in all_messages if cat.startswith('toast-') %}
  {% set _ = toasts.append((cat, msg)) %}
{% endfor %}

{% if toasts %}
<script>document.addEventListener("DOMContentLoaded", () => {
  {% for category, message in all_messages if category.startswith('toast-') %}
    Toast({ message: {{ message | tojson }}, type: {{ category.replace('toast-', '') | tojson }} });
  {% endfor %}
});</script>
{% endif %}

<div class="toast-container position-fixed bottom-0 end-0 p-3"
     x-data="ToastManager"
     @show-toast.window="show($event.detail)">
  <template x-for="item in toasts" :key="item.id">
    <div class="toast align-items-center border-0"
         :data-toast-id="item.id" :class="'text-bg-' + item.type"
         role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" x-html="item.message"></div>
        <button data-bs-theme="light" type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="{{ _('Close') }}"></button>
      </div>
    </div>
  </template>
</div>
